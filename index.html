  <body>
    <div id="root"></div>
    <a href="" id="telegramShare"></a>
    <script>
     const telegram = window.Telegram.WebApp;

     if (telegram) {
        telegram.ready();
        telegram.expand();
      }

      var shareLink = "";
      var group = "";
      function handleResetScreen() {
            window.scrollTo({ top: 0 });
        };

        async function handleCopy() {
          try {
            const button = document.getElementById("copyButton");
              const copyText = button.getAttribute("data-address");
              var textArea = document.createElement("textarea");
              textArea.value = copyText;
              document.body.appendChild(textArea);
              textArea.select();
              textArea.setSelectionRange(0, textArea.value.length);
              document.execCommand('copy', false, textArea.value);
              document.body.removeChild(textArea);
              console.log("Try copying to clipboard");
              await navigator.clipboard.writeText(copyText);
              console.log("Content copied to clipboard");
            } catch (err) {
              console.error("Failed to copy: ", err);
            }
          };
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <button id="resetButton" onclick="handleResetScreen()" hidden>Reset</button>
    <button id="copyButton" onclick="handleCopy()" hidden>Copy</button>
  </body>
