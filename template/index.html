<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="MobileOptimized" content="176" />
    <meta name="HandheldFriendly" content="True" />
    <meta name="robots" content="noindex,nofollow" />

    <script>
      function setThemeClass() {
        document.documentElement.className = Telegram.WebApp.colorScheme;
      }

      Telegram.WebApp.onEvent("themeChanged", setThemeClass);
      setThemeClass();
    </script>
    <style>
      body {
        --bg-color: var(--tg-theme-bg-color, #fff);
        font-family: sans-serif;
        background-color: var(--bg-color);
        color: var(--tg-theme-text-color, #222);
        font-size: 14px;
        margin: 0;
        padding: 0;
        color-scheme: var(--tg-color-scheme);
      }

      body.gray {
        background-color: var(--tg-theme-secondary-bg-color, #efefef);
      }

      a {
        color: var(--tg-theme-link-color, #2678b6);
      }

      .btn {
        font-size: 14px;
        padding: 10px 17px;
      }

      .btn-primary {
        background-color: var(--tg-theme-button-color, #50a8eb);
        color: var(--tg-theme-button-text-color, #fff);
        border: none;
      }

      button {
        display: block;
        width: 100%;
        font-size: 14px;
        margin: 15px 0;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        background-color: var(--tg-theme-button-color, #50a8eb);
        color: var(--tg-theme-button-text-color, #ffffff);
        cursor: pointer;
      }

      .main-container {
        padding: 15px;
      }

      .list-header {
        text-transform: uppercase;
        font-size: 0.92em;
        color: var(--tg-theme-hint-color, #ccc);
        margin: 0 0 10px;
      }

      a.list-group-item,
      button.list-group-item {
        color: var(--tg-theme-text-color, #222);
      }

      .main-container p {
        margin: 0 0 10px;
      }

      .main-container pre,
      .main-container > .btn {
        margin: 0 0 7px;
      }

      .main-container pre + .hint,
      .main-container > .btn + .hint {
        text-align: center;
        margin: 0 0 15px;
      }

      button[disabled] {
        opacity: 0.6;
        cursor: auto;
        pointer-events: none;
      }

      button.close_btn {
        /*position: fixed;*/
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 0;
        margin: 0;
        padding: 16px 20px;
        text-transform: uppercase;
      }

      input[type="text"],
      .input[contenteditable] {
        display: block;
        box-sizing: border-box;
        font-size: 14px;
        width: 100%;
        padding: 12px 20px;
        margin: 15px 0;
        border: 1px solid var(--tg-theme-link-color, #000);
        background-color: var(--tg-theme-bg-color, #ffffff);
        border-radius: 4px;
        color: var(--tg-theme-text-color, #222222);
        text-align: start;
      }

      input[type="text"]::-webkit-input-placeholder {
        color: var(--tg-theme-hint-color, #ccc);
      }

      input[type="text"]::-moz-placeholder {
        color: var(--tg-theme-hint-color, #ccc);
      }

      input[type="text"]:-ms-input-placeholder {
        color: var(--tg-theme-hint-color, #ccc);
      }

      .input[data-placeholder] {
        position: relative;
      }

      .input[data-placeholder]:empty:before {
        position: absolute;
        left: 0;
        right: 0;
        content: attr(data-placeholder);
        color: var(--tg-theme-hint-color, #ccc);
        padding: 0 20px;
        font-weight: normal;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
      }

      section {
        padding: 15px;
        text-align: center;
        background-color: var(--bg-color, #ffffff);
      }

      section#top_sect {
        background-color: var(--tg-theme-bg-color, #ffffff);
      }

      section#top_sect.second {
        background-color: var(--tg-theme-secondary-bg-color, #efefef);
      }

      section .sect_row {
        margin: 10px 0;
      }

      section + section {
        padding: 0 15px 65px;
      }

      p {
        margin: 40px 0 15px;
      }

      ul {
        text-align: left;
      }

      li {
        color: var(--tg-theme-hint-color, #a8a8a8);
      }

      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 7px;
      }

      pre {
        background: rgba(0, 0, 0, 0.07);
        color: var(--tg-theme-text-color, #222);
        font-size: 12px;
        border: none;
        border-radius: 4px;
        padding: 8px;
        margin: 7px 0;
        word-break: break-word;
        white-space: pre-wrap;
        text-align: left;
      }

      .dark pre {
        background: rgba(255, 255, 255, 0.15);
      }

      .chat_img {
        width: 30px;
        border-radius: 15px;
        margin-right: 10px;
      }

      .columns {
        display: flex;
      }

      .columns > * {
        flex-grow: 1;
      }

      .hint {
        font-size: 0.8em;
        color: var(--tg-theme-hint-color, #a8a8a8);
      }

      .ok {
        color: green;
      }

      .err {
        color: red;
      }

      .status_need {
        display: none;
      }

      #fixed_wrap {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        transform: translateY(100vh);
      }

      .viewport-container {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: var(--tg-viewport-stable-height, 100vh);
        transition: height 0.2s ease;
      }

      .viewport-container .main-container {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .viewport-container .main-container button {
        width: auto;
      }

      .viewport-border,
      .viewport-stable_border {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        height: var(--tg-viewport-height, 100vh);
        pointer-events: none;
      }

      .viewport-stable_border {
        height: var(--tg-viewport-stable-height, 100vh);
      }

      .viewport-border:before,
      .viewport-stable_border:before {
        content: attr(text);
        display: inline-block;
        position: absolute;
        background: gray;
        right: 0;
        top: 0;
        font-size: 7px;
        padding: 2px 4px;
        vertical-align: top;
      }

      .viewport-stable_border:before {
        background: green;
        left: 0;
        right: auto;
      }

      .viewport-border:after,
      .viewport-stable_border:after {
        content: "";
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        border: 2px dashed gray;
      }

      .viewport-stable_border:after {
        border-color: green;
      }

      small {
        font-size: 12px;
      }
    </style>
  </head>

  <body class="" style="visibility: hidden">
    <section>
      <div id="status_show"></div>
      <div id="btn_status" class="hint" style="display: none"></div>

    <div class="viewport-stable_border"></div>

    <script type="application/javascript">
      /*
       * This is a demo code for Telegram WebApp for Bots
       * It contains basic examples of how to use the API
       * Note: all requests to backend are disabled in this demo, you should use your own backend
       */

      var encryptedData;

      const customWallet = {
        name: "DemoWallet",
        imageUrl:
          "https://purple-advisory-wombat-172.mypinata.cloud/ipfs/QmRXiq4qhHAzqufjAVUFQzHGrTcpqNCMUADd46aeS2ofXA?pinataGatewayToken=YGrSaWv7gcuq1OtGbYvONGKkoZ2K4X4JxSnjDZeOE-HAIFWMayFyhMjP8FSr4JaY",
        aboutUrl:
          "https://purple-advisory-wombat-172.mypinata.cloud/ipfs/QmRXiq4qhHAzqufjAVUFQzHGrTcpqNCMUADd46aeS2ofXA?pinataGatewayToken=YGrSaWv7gcuq1OtGbYvONGKkoZ2K4X4JxSnjDZeOE-HAIFWMayFyhMjP8FSr4JaY",
        jsBridgeKey: "",
        bridgeUrl: "https://bridge.ton.space/bridge",
        universalLink: "https://t.me/demo_wallet_bot/demo_wallet?attach=wallet&mode=compact",
      };

      const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: "https://web-games.appscyclone.com/tonconnect-manifest.json",
        uiOptions: {
          walletsListConfiguration: {
            includeWallets: [customWallet],
          },
        },
      });
      const currentWalletInfoNotYet = tonConnectUI.walletInfo;
      console.log("currentWalletInfoNotYet", currentWalletInfoNotYet);
      tonConnectUI.getSelectedWalletInfo().then((wallet) => {
        console.log("getSelectedWalletInfo", wallet);
        const currentWallet = tonConnectUI.wallet;
        const currentWalletInfo = tonConnectUI.walletInfo;
        const currentAccount = tonConnectUI.account;
        const currentIsConnectedStatus = tonConnectUI.connected;
        const currentState = tonConnectUI.singleWalletModalState;
        console.log("currentWallet", currentWallet);
        console.log("currentWalletInfo", currentWalletInfo);
        console.log("currentAccount", currentAccount);
        console.log("currentIsConnectedStatus", currentIsConnectedStatus);
        console.log("Current modal state:", currentState);
        changeStatusButton();
      });
      const unsubscribe = tonConnectUI.onStatusChange((walletAndwalletInfo) => {
        const currentWallet = tonConnectUI.wallet;
        const currentWalletInfo = tonConnectUI.walletInfo;
        const currentAccount = tonConnectUI.account;
        const currentIsConnectedStatus = tonConnectUI.connected;
        const currentState = tonConnectUI.singleWalletModalState;
        console.log("currentWallet", currentWallet);
        console.log("currentWalletInfo", currentWalletInfo);
        console.log("currentAccount", currentAccount);
        console.log("currentIsConnectedStatus", currentIsConnectedStatus);
        console.log("Current modal state:", currentState);
        changeStatusButton();
      });

      tonConnectUI.uiOptions = {
        twaReturnUrl: "https://t.me/nexum_labs_bot/game_center",
      };

      async function changeStatusButton() {
        if (encryptedData == null) {
          setTimeout(function () {
            this.changeStatusButton();
          }, 1000);

          return;
        }
        const currentIsConnectedStatus = tonConnectUI.connected;
        const currentAccount = tonConnectUI.account;
        const btn = document.querySelector("#main_btn_ton");
        btn.textContent = currentIsConnectedStatus ? "DISCONNECT" : "CONNECT TO WALLET";
        if (currentIsConnectedStatus) {
          document.getElementById("webview_wallet_data").innerHTML = "@ADDRESS: " + currentAccount.publicKey;
        } else {
          document.getElementById("webview_wallet_data").innerHTML = "@ADDRESS:";
        }
      }
      async function connectToWallet(tonProofPayload) {
        tonConnectUI.setConnectRequestParameters({
          state: "ready",
          value: {
            tonProof: tonProofPayload,
          },
        });
        const connectedWallet = await tonConnectUI.connectWallet();
        // Do something with connectedWallet if needed
        const tonProof = connectedWallet.connectItems?.tonProof;
        console.log("tonProof", tonProof);
        console.log("proof", tonProof.proof);
        // check proof
        if (tonProof) {
          fetch("https://api-dev-games.appscyclone.com/v1/user/check-proof", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + encryptedData,
              "Access-Control-Allow-Origin": "*",
            },
            body: JSON.stringify({
              address: connectedWallet.account.address, // Replace with your data
              network: connectedWallet.account.chain,
              proof: {
                ...tonProof.proof,
                state_init: connectedWallet.account.walletStateInit,
              },
              // Add more key-value pairs as needed
            }),
          })
            .then(function (response) {
              console.log("response", response);
              response.json().then(function (res) {
                console.log(res);
              });
            })
            .catch(function (error) {
              console.log(error);
            });
        }
      }

      async function actionWallet() {
        const btn = document.querySelector("#main_btn_ton");
        if (btn.textContent == "LOADING..." || btn.textContent == "CONNECTING...") return;
        const currentIsConnectedStatus = tonConnectUI.connected;
        if (currentIsConnectedStatus) {
          await tonConnectUI.disconnect();
        } else {
          this.connect();
        }
      }

      function connect() {
        const btn = document.querySelector("#main_btn_ton");
        btn.textContent = "CONNECTING...";
        fetch("https://api-dev-games.appscyclone.com/v1/user/generate-payload", {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + encryptedData,
            "Access-Control-Allow-Origin": "*",
          },
        }).then(function (response) {
          response.json().then(function (res) {
            console.log(res.data);
            connectToWallet(res.data).catch((error) => {
              console.error("Error connecting to wallet:", error);
            });
          });
        });
        // Call the function
      }

      var firstOpen = true;

      console.log(Telegram.WebApp.initData);
      const DemoApp = {
        initData: Telegram.WebApp.initData || "",
        initDataUnsafe: Telegram.WebApp.initDataUnsafe || {},
        MainButton: Telegram.WebApp.MainButton,

        init(options) {
          document.body.style.visibility = "";
          Telegram.WebApp.ready();
          Telegram.WebApp.MainButton.setParams({
            text: "CLOSE",
            is_visible: true,
          }).onClick(DemoApp.close);

          // // Function to handle visibility change
          // function handleVisibilityChange() {
          //         const status = document.getElementById('status');
          //         if (document.hidden) {
          //         } else if(!firstOpen){
          //             DemoApp.apiRequest('checkInitData', {}, function (result) {

          //             });
          //         }
          //         firstOpen = false;
          // }

          // Add event listener for visibility change
          // document.addEventListener('visibilitychange', handleVisibilityChange);

          // Initial check
          // handleVisibilityChange();
        },
        expand() {
          Telegram.WebApp.expand();
        },
        close() {
          Telegram.WebApp.close();
        },
        toggleMainButton(el) {
          const mainButton = Telegram.WebApp.MainButton;
          if (mainButton.isVisible) {
            mainButton.hide();
            el.innerHTML = "Show Main Button";
          } else {
            mainButton.show();
            el.innerHTML = "Hide Main Button";
          }
        },

        // actions
        openTrumpRun() {
          Telegram.WebApp.openTelegramLink("https://t.me/nexum_labs_bot/trump_run");
        },
        openPingpongz() {
          Telegram.WebApp.openTelegramLink("https://t.me/nexum_labs_bot/pingpongz");
        },
        openBlackJack() {
          Telegram.WebApp.openTelegramLink("https://t.me/nexum_labs_bot/blackjack");
        },
        openBigMoney() {
          Telegram.WebApp.openTelegramLink("https://t.me/nexum_labs_bot/big_money");
        },
        sendMessage(msg_id, with_webview) {
          if (!DemoApp.initDataUnsafe.query_id) {
            alert("WebViewQueryId not defined");
            return;
          }

          document.querySelectorAll("button").forEach((btn) => (btn.disabled = true));

          const btn = document.querySelector("#btn_status");
          btn.textContent = "Sending...";

          DemoApp.apiRequest(
            "sendMessage",
            {
              msg_id: msg_id || "",
              with_webview: !DemoApp.initDataUnsafe.receiver && with_webview ? 1 : 0,
            },
            function (result) {
              document.querySelectorAll("button").forEach((btn) => (btn.disabled = false));

              if (result.response) {
                if (result.response.ok) {
                  btn.textContent = "Message sent successfully!";
                  btn.className = "ok";
                  btn.style.display = "block";
                } else {
                  btn.textContent = result.response.description;
                  btn.className = "err";
                  btn.style.display = "block";
                  alert(result.response.description);
                }
              } else if (result.error) {
                btn.textContent = result.error;
                btn.className = "err";
                btn.style.display = "block";
                alert(result.error);
              } else {
                btn.textContent = "Unknown error";
                btn.className = "err";
                btn.style.display = "block";
                alert("Unknown error");
              }
            }
          );
        },
        changeMenuButton(close) {
          document.querySelectorAll("button").forEach((btn) => (btn.disabled = true));
          const btnStatus = document.querySelector("#btn_status");
          btnStatus.textContent = "Changing button...";

          DemoApp.apiRequest("changeMenuButton", {}, function (result) {
            document.querySelectorAll("button").forEach((btn) => (btn.disabled = false));

            if (result.response) {
              if (result.response.ok) {
                btnStatus.textContent = "Button changed!";
                btnStatus.className = "ok";
                btnStatus.style.display = "block";
                Telegram.WebApp.close();
              } else {
                btnStatus.textContent = result.response.description;
                btnStatus.className = "err";
                btnStatus.style.display = "block";
                alert(result.response.description);
              }
            } else if (result.error) {
              btnStatus.textContent = result.error;
              btnStatus.className = "err";
              btnStatus.style.display = "block";
              alert(result.error);
            } else {
              btnStatus.textContent = "Unknown error";
              btnStatus.className = "err";
              btnStatus.style.display = "block";
              alert("Unknown error");
            }
          });
          if (close) {
            setTimeout(function () {
              Telegram.WebApp.close();
            }, 50);
          }
        },
        checkInitData() {
          const webViewStatus = document.querySelector("#webview_data_status");
          if (DemoApp.initData && webViewStatus.classList.contains("status_need")) {
            webViewStatus.classList.remove("status_need");
            DemoApp.apiRequest("checkInitData", {}, function (result) {
              webViewStatus.textContent = "";
              webViewStatus.className = "ok";
            });
          }
        },
        sendText(spam) {
          const textField = document.querySelector("#text_field");
          const text = textField.value;
          if (!text.length) {
            return textField.focus();
          }
          if (byteLength(text) > 4096) {
            return alert("Text is too long");
          }

          const repeat = spam ? 10 : 1;
          for (let i = 0; i < repeat; i++) {
            Telegram.WebApp.sendData(text);
          }
        },
        sendTime(spam) {
          const repeat = spam ? 10 : 1;
          for (let i = 0; i < repeat; i++) {
            Telegram.WebApp.sendData(new Date().toString());
          }
        },

        // Alerts
        showAlert(message) {
          Telegram.WebApp.showAlert(message);
        },
        showConfirm(message) {
          Telegram.WebApp.showConfirm(message);
        },
        requestWriteAccess() {
          Telegram.WebApp.requestWriteAccess(function (result) {
            if (result) {
              DemoApp.showAlert("Write access granted");
            } else {
              DemoApp.showAlert("Write access denied");
            }
          });
        },
        requestContact() {
          Telegram.WebApp.requestContact(function (result) {
            if (result) {
              DemoApp.showAlert("Contact granted");
            } else {
              DemoApp.showAlert("Contact denied");
            }
          });
        },
        isVersionAtLeast(version) {
          return Telegram.WebApp.isVersionAtLeast(version);
        },
        //version to string Example: '6.9'
        doesntSupport(version) {
          // console.log("version: " + version);
          // console.log("realVersion: " + this.version());
          // console.log("doesntSupport: " + this.isVersionAtLeast(version));
          if (!this.isVersionAtLeast(version)) {
            Telegram.WebApp.showAlert("This feature is not supported in this version of Telegram", function () {
              Telegram.WebApp.close();
            });
            throw new Error("This feature is not supported in this version of Telegram");
          }
        },
        showPopup() {
          Telegram.WebApp.showPopup(
            {
              title: "Popup title",
              message: "Popup message",
              buttons: [
                { id: "delete", type: "destructive", text: "Delete all" },
                { id: "faq", type: "default", text: "Open FAQ" },
                { type: "cancel" },
              ],
            },
            function (buttonId) {
              if (buttonId === "delete") {
                DemoApp.showAlert("'Delete all' selected");
              } else if (buttonId === "faq") {
                Telegram.WebApp.openLink("https://telegram.org/faq");
              }
            }
          );
        },
        showScanQrPopup: function (linksOnly) {
          Telegram.WebApp.showScanQrPopup(
            {
              text: linksOnly ? "with any link" : "for test purposes",
            },
            function (text) {
              if (linksOnly) {
                const lowerText = text.toString().toLowerCase();
                if (lowerText.substring(0, 7) === "http://" || lowerText.substring(0, 8) === "https://") {
                  setTimeout(function () {
                    Telegram.WebApp.openLink(text);
                  }, 50);

                  return true;
                }
              } else {
                DemoApp.showAlert(text);

                return true;
              }
            }
          );
        },

        // Permissions
        requestLocation(el) {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function (position) {
              el.nextElementSibling.innerHTML = "(" + position.coords.latitude + ", " + position.coords.longitude + ")";
              el.nextElementSibling.className = "ok";
            });
          } else {
            el.nextElementSibling.innerHTML = "Geolocation is not supported in this browser.";
            el.nextElementSibling.className = "err";
          }
          return false;
        },
        requestVideo(el) {
          if (navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia({ audio: false, video: true }).then(function (stream) {
              el.nextElementSibling.innerHTML = "(Access granted)";
            });
          } else {
            el.nextElementSibling.innerHTML = "Media devices is not supported in this browser.";
            el.nextElementSibling.className = "err";
          }
          return false;
        },
        requestAudio(el) {
          if (navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(function (stream) {
              el.nextElementSibling.innerHTML = "(Access granted)";
              el.nextElementSibling.className = "ok";
            });
          } else {
            el.nextElementSibling.innerHTML = "Media devices is not supported in this browser.";
            el.nextElementSibling.className = "err";
          }
          return false;
        },
        requestAudioVideo(el) {
          if (navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: true }).then(function (stream) {

      function byteLength(str) {
        if (window.Blob) {
          try {
            return new Blob([str]).size;
          } catch (e) {}
        }

        let s = str.length;
        for (let i = str.length - 1; i >= 0; i--) {
          const code = str.charCodeAt(i);
          if (code > 0x7f && code <= 0x7ff) {
            s++;
          } else if (code > 0x7ff && code <= 0xffff) {
            s += 2;
          }

          if (code >= 0xdc00 && code <= 0xdfff) {
            i--;
          }
        }
        return s;
      }

      function round(val, d) {
        const k = Math.pow(10, d || 0);
        return Math.round(val * k) / k;
      }
